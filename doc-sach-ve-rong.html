<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#183b35">
<title>VE RỖNG — HẢO PHẠM | Khu Vườn Tâm Thức</title>
<style>
:root{color-scheme:light;--ink:#26352e;--paper:#f8f4e9;--gold:#b58b52;--green:#183b35}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Georgia,'Times New Roman',serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:var(--green);color:#f7eedc;font-family:system-ui,-apple-system,sans-serif}
header a{color:#f7dca9;text-decoration:none;font-size:13px;white-space:nowrap}header .bookname{font-size:14px;letter-spacing:.04em;text-align:center}
.controls{display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 5px;background:#eae2d0;border-bottom:1px solid #d4c6aa;font-family:system-ui,-apple-system,sans-serif;flex-wrap:nowrap}.controls button{padding:9px 10px;font-size:16px}.controls #jumpBack,.controls #jumpForward{font-size:14px;padding:9px 7px;min-width:43px}
button{border:1px solid #b7a27f;background:#fffaf0;color:#29443a;padding:8px 13px;border-radius:4px;font-size:16px;min-width:42px}button:disabled{opacity:.4}
#page{font-weight:600;text-align:center;max-width:60%;overflow-wrap:anywhere}
#status{font:13px/1.5 system-ui,sans-serif;text-align:center;padding:8px 12px;color:#655944;min-height:38px}
#viewer{height:calc(100dvh - 150px);min-height:420px;width:100%;overflow:hidden;background:var(--paper)}
#viewer iframe{border:0!important}
@media(min-width:800px){#viewer{max-width:900px;margin:0 auto;height:calc(100dvh - 150px);box-shadow:0 0 24px #c7b99d}}
</style>
</head>
<body>
<header><a href="index.html">← Hồ Nước</a><div class="bookname">VE RỖNG · HẢO PHẠM</div><span style="width:54px"></span></header>
<div class="controls"><button id="prev" aria-label="Trang trước" disabled>‹</button><button id="jumpBack" aria-label="Lùi 10 trang">−10</button><span id="page">Đang chuẩn bị…</span><button id="jumpForward" aria-label="Tiến 10 trang">+10</button><button id="next" aria-label="Trang sau" disabled>›</button></div>
<div id="status" role="status" aria-live="polite">Đang kết nối để mở sách…</div>
<div id="viewer" aria-label="Trang đọc sách"></div>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>

<script>
(async function(){
 const status=document.getElementById('status'), page=document.getElementById('page');
 const prev=document.getElementById('prev'), next=document.getElementById('next');
 const jumpBack=document.getElementById('jumpBack'), jumpForward=document.getElementById('jumpForward');
 const bookUrl=new URL('./Books/VE_RONG_HAO_PHAM_EPUB_V16.epub',window.location.href).href;
 const timeout=(promise,ms,label)=>Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error(label)),ms))]);
 try{
  status.textContent='Đang kiểm tra bộ đọc sách…';
  await timeout(new Promise((resolve,reject)=>{
   if(typeof ePub==='function') resolve();
   else {const s=document.querySelector('script[src*="epub.min.js"]'); if(s){s.addEventListener('load',()=>typeof ePub==='function'?resolve():reject(new Error('Thư viện EPUB.js đã tải nhưng không khởi động được.')),{once:true});s.addEventListener('error',()=>reject(new Error('Không tải được thư viện EPUB.js.')),{once:true});}else reject(new Error('Không tìm thấy thư viện EPUB.js.'));}
  }),10000,'Hết thời gian chờ thư viện EPUB.js. Hãy kiểm tra kết nối mạng.');
  status.textContent='Đang tải tệp sách…';
  const response=await timeout(fetch(bookUrl,{cache:'no-store'}),15000,'Hết thời gian chờ tải tệp EPUB.');
  if(!response.ok) throw new Error('Không tìm thấy tệp sách (HTTP '+response.status+').');
  const type=(response.headers.get('content-type')||'').toLowerCase();
  const data=await response.arrayBuffer();
  if(data.byteLength<1000) throw new Error('Tệp tải về quá nhỏ hoặc không phải EPUB.');
  if(type.includes('text/html')) throw new Error('Máy chủ trả về trang HTML thay vì tệp EPUB. Hãy kiểm tra đường dẫn books.');
  status.textContent='Đang dựng trang sách…';
  const book=ePub(data);
  const rendition=book.renderTo('viewer',{width:'100%',height:'100%',flow:'paginated',spread:'none',manager:'default'});
  rendition.themes.default({'body':{'font-family':'Georgia, "Times New Roman", serif','font-size':'1.18em','line-height':'1.75','color':'#26352e','padding':'0 5% !important'},'p':{'text-align':'justify','line-height':'1.75'}});
  // Remove only the printed table-of-contents entry, not a standalone author section.
  rendition.hooks.content.register(contents=>{
   try {
    const doc=contents.document;
    doc.querySelectorAll('h1,h2,h3,h4,p,li,a').forEach(el=>{
     if((el.textContent||'').trim()==='Về tác giả'){
      const parent=el.parentElement;
      if(parent && (parent.classList.contains('toc-entry') || /^(li|p)$/i.test(parent.tagName)) && (parent.textContent||'').trim()==='Về tác giả') parent.remove();
      else el.remove();
     }
    });
   } catch(e) { console.warn('Không thể lọc mục Về tác giả:',e); }
  });
  let sectionPages=[];
  let totalBookPages=0;
  let currentSpineIndex=0;
  function updateCounter(loc){
   if(!loc || !loc.start || !loc.start.displayed){page.textContent='Đang đọc';return;}
   const idx=Number.isInteger(loc.start.index)?loc.start.index:0;
   currentSpineIndex=idx;
   const localPage=loc.start.displayed.page||1;
   const offset=sectionPages.slice(0,idx).reduce((sum,n)=>sum+(n||0),0);
   if(totalBookPages>0 && sectionPages[idx]) page.textContent='Trang '+(offset+localPage)+' / '+totalBookPages;
   else page.textContent='Trang '+localPage+' · chương '+(idx+1);
   prev.disabled=!!loc.atStart; next.disabled=!!loc.atEnd;
  }
  rendition.on('relocated',updateCounter);
  prev.addEventListener('click',()=>rendition.prev());
  next.addEventListener('click',()=>rendition.next());
  async function jumpPages(delta){
   const step=delta<0?()=>rendition.prev():()=>rendition.next();
   for(let i=0;i<Math.abs(delta);i++){
    try { await step(); } catch(e) { break; }
   }
  }
  jumpBack.addEventListener('click',()=>jumpPages(-10));
  jumpForward.addEventListener('click',()=>jumpPages(10));
  await timeout(book.ready,15000,'Đã tải tệp nhưng EPUB không hoàn tất khởi tạo.');
  await timeout(rendition.display(),15000,'Đã nạp sách nhưng trang đầu không hiển thị kịp.');
  status.textContent='Đang tính số trang toàn sách…';
  // Measure every spine section in a separate off-screen rendition so the visible reader does not jump.
  try {
   const measure=document.createElement('div');
   measure.style.cssText='position:fixed;left:-12000px;top:0;width:'+Math.max(320,document.getElementById('viewer').clientWidth)+'px;height:'+Math.max(420,document.getElementById('viewer').clientHeight)+'px;overflow:hidden;visibility:hidden;';
   document.body.appendChild(measure);
   const meter=book.renderTo(measure,{width:'100%',height:'100%',flow:'paginated',spread:'none',manager:'default'});
   for(const item of book.spine.spineItems){
    try {
     const count=await new Promise(async (resolve,reject)=>{
      const timer=setTimeout(()=>{meter.off('relocated',handler);reject(new Error('timeout'));},5000);
      const handler=loc=>{if(loc && loc.start && loc.start.displayed){clearTimeout(timer);meter.off('relocated',handler);resolve(loc.start.displayed.total||1);}};
      meter.on('relocated',handler);
      try { await meter.display(item.href); } catch(err){clearTimeout(timer);meter.off('relocated',handler);reject(err);}
     });
     sectionPages.push(count);
    } catch(e){sectionPages.push(1);}
   }
   totalBookPages=sectionPages.reduce((sum,n)=>sum+(n||0),0);
   meter.destroy(); measure.remove();
   // Restore the reader to the beginning after background pagination measurement.
   await rendition.display();
   status.textContent='Sách đã mở. Dùng mũi tên hoặc nút ±10 để lật trang.';
  } catch(measureError){
   console.warn('Không tính được tổng trang:',measureError);
   status.textContent='Sách đã mở. Dùng mũi tên hoặc nút ±10 để lật trang.';
  }
  document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')rendition.prev();if(e.key==='ArrowRight')rendition.next();});
 }catch(err){
  console.error('Lỗi mở EPUB:',err);
  page.textContent='Chưa mở được';
  status.textContent='Lỗi: '+(err&&err.message?err.message:'không xác định')+' Bạn hãy chụp màn hình thông báo này gửi mình.';
 }
})();
</script>
</body></html>
