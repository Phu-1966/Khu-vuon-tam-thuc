<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#183b35">
<title>NƯỚC MẮM — HẢO PHẠM | Khu Vườn Tâm Thức</title>
<style>
:root{color-scheme:light;--ink:#26352e;--paper:#f8f4e9;--gold:#b58b52;--green:#183b35}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:Georgia,'Times New Roman',serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:var(--green);color:#f7eedc;font-family:system-ui,-apple-system,sans-serif}
header a{color:#f7dca9;text-decoration:none;font-size:13px}header .bookname{font-size:14px;letter-spacing:.04em;text-align:center}
.controls{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px;background:#eae2d0;border-bottom:1px solid #d4c6aa;font-family:system-ui,-apple-system,sans-serif}
button{border:1px solid #b7a27f;background:#fffaf0;color:#29443a;padding:8px 13px;border-radius:4px;font-size:16px}button:disabled{opacity:.4}
#status{font:13px system-ui,sans-serif;text-align:center;padding:8px 12px;color:#655944}
#viewer{height:calc(100dvh - 116px);min-height:420px;width:100%;overflow:hidden;background:var(--paper)}
#viewer iframe{border:0!important}
@media(min-width:800px){#viewer{max-width:900px;margin:0 auto;height:calc(100dvh - 116px);box-shadow:0 0 24px #c7b99d}}
</style>
</head>
<body>
<header><a href="index.html">← Hồ Nước</a><div class="bookname">NƯỚC MẮM · HẢO PHẠM</div><span style="width:54px"></span></header>
<div class="controls"><button id="prev" aria-label="Trang trước">‹</button><span id="page">Đang mở sách…</span><button id="next" aria-label="Trang sau">›</button></div>
<div id="status">Một cuốn sách bên mặt hồ.</div>
<div id="viewer" aria-label="Trang đọc sách"></div>
<script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script>
<script>
(async function(){
 const status=document.getElementById('status'), page=document.getElementById('page');
 const prev=document.getElementById('prev'), next=document.getElementById('next');
 try{
  if(typeof ePub!=='function') throw new Error('Không tải được bộ đọc sách. Hãy kiểm tra kết nối mạng rồi tải lại trang.');
  const book=ePub('books/NUOC_MAM_HAO_PHAM_EPUB_V4.epub');
  const rendition=book.renderTo('viewer',{width:'100%',height:'100%',flow:'paginated',spread:'none',manager:'default'});
  rendition.themes.default({'body':{'font-family':'Georgia, "Times New Roman", serif','line-height':'1.7','color':'#26352e','padding':'0 5% !important'},'p':{'text-align':'justify','line-height':'1.7'}});
  rendition.on('relocated',loc=>{const c=loc&&loc.start&&loc.start.cfi;page.textContent=(loc&&loc.start&&loc.start.displayed)?('Trang '+loc.start.displayed.page+' / '+loc.start.displayed.total):'Đang đọc';prev.disabled=!loc||!loc.atStart;next.disabled=!loc||!loc.atEnd;});
  prev.addEventListener('click',()=>rendition.prev()); next.addEventListener('click',()=>rendition.next());
  await book.ready;
  await rendition.display();
  status.textContent='Chạm vào mũi tên để lật trang.';
  document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')rendition.prev();if(e.key==='ArrowRight')rendition.next();});
 }catch(err){console.error(err);status.textContent='Chưa mở được sách: '+(err&&err.message?err.message:'lỗi không xác định')+'. Hãy kiểm tra tệp EPUB trong thư mục books.';page.textContent='Lỗi mở sách';}
})();
</script>
</body></html>
